included:
  - App
  - Core
  - Features
  - Tests

excluded:
  - Features/Web/WebPage.swift # embedded HTML, CSS and JS
  - .build
  - DerivedData

strict: false

opt_in_rules:
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fatal_error_message
  - first_where
  - force_unwrapping
  - implicitly_unwrapped_optional
  - redundant_nil_coalescing
  - vertical_whitespace_closing_braces

# Relaxed for the code taken over from the 1.0 release (parsers, SQL catalog, JSON field names, HLS "master" playlist).
disabled_rules:
  - trailing_comma
  - nesting
  - large_tuple
  - inclusive_language
  - optional_data_string_conversion # invalid UTF-8 from ffmpeg and tags must decode leniently

line_length:
  warning: 200
  error: 400

type_body_length:
  warning: 500
  error: 700

file_length:
  warning: 650
  error: 900

identifier_name:
  min_length: 1
  allowed_symbols: ["_"]
  max_length: 50
  excluded: [i, j, x, y]

cyclomatic_complexity:
  warning: 30
  error: 40

function_body_length:
  warning: 100
  error: 150

function_parameter_count:
  warning: 8
  error: 10
