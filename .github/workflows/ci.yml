name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    uses: novami/minor-swift-core/.github/workflows/lint.yml@0.1.4

  test:
    uses: novami/minor-swift-core/.github/workflows/app-test.yml@0.1.4
    with:
      scheme: MinorDLNA
      cache-path: build/ffmpeg/out
      cache-key-files: Scripts/build-ffmpeg.sh
