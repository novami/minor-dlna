name: CI

on:
  push:
    branches: [main]
    paths: ["macos/**", "packaging/**", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["macos/**", "packaging/**", ".github/workflows/ci.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # macos-latest is Apple Silicon (arm64), the only architecture the app is built for.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: swift
        run: echo "version=$(swift --version 2>&1 | grep -o 'Swift version [0-9.]*' | tr ' ' '-')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: macos/.build
          key: build-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-${{ github.sha }}
          restore-keys: build-${{ runner.os }}-${{ runner.arch }}-${{ steps.swift.outputs.version }}-${{ hashFiles('macos/Package.swift', 'macos/Package.resolved') }}-
      - run: swift test --package-path macos
      - run: swift build -c release --arch arm64 --package-path macos
