name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: novami/minor-swift-core/.github/workflows/lint.yml@0.1.4

  test:
    uses: novami/minor-swift-core/.github/workflows/app-test.yml@0.1.4
    with:
      scheme: MinorDLNA
      cache-path: build/ffmpeg/out
      cache-key-files: scripts/build-ffmpeg.sh

  release:
    needs: [lint, test]
    permissions:
      contents: write
    uses: novami/minor-swift-core/.github/workflows/app-release.yml@0.1.4
    with:
      scheme: MinorDLNA
      cache-path: build/ffmpeg/out
      cache-key-files: scripts/build-ffmpeg.sh
    secrets: inherit
